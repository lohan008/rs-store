
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comprovante - RS Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .pagina-comprovante {
            max-width: 950px;
            margin: 40px auto;
            padding: 25px;
        }

        .comprovante-box {
            background: #151515;
            border: 1px solid #087cff;
            border-radius: 12px;
            padding: 30px;
            color: white;
            box-shadow: 0 0 15px #087cff55;
        }

        .comprovante-box h1,
        .comprovante-box h2 {
            color: #168cff;
            margin-bottom: 15px;
        }

        .comprovante-secao {
            border-bottom: 1px solid #333;
            padding: 20px 0;
        }

        .comprovante-secao p {
            margin: 8px 0;
        }

        .produto-comprovante {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 12px 0;
        }

        .produto-comprovante small {
            display: inline-block;
            margin-top: 5px;
            color: #aaa;
        }

        .total-comprovante {
            color: #168cff;
            font-size: 23px;
            font-weight: bold;
        }

        /* =====================================
           NOVO RASTREAMENTO DO PEDIDO
        ===================================== */

        .rastreamento-pedido {
            margin-top: 25px;
            padding: 25px 15px;
            background: #101820;
            border: 1px solid #263b50;
            border-radius: 12px;
        }

        .status-atual {
            text-align: center;
            margin-bottom: 30px;
            color: #ccc;
        }

        .status-atual strong {
            display: block;
            color: #168cff;
            font-size: 20px;
            margin-top: 8px;
        }

        .etapas-pedido {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            width: 100%;
        }

        .etapa-pedido {
            position: relative;
            text-align: center;
            color: #777;
            font-size: 13px;
            font-weight: 500;
            padding: 0 5px;
        }

        .etapa-pedido span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: #252d36;
            border: 2px solid #46515d;
            color: #aaa;
            font-size: 17px;
            font-weight: bold;
            position: relative;
            z-index: 2;
            transition: 0.3s;
        }

        /* Linha com seta entre as etapas */

        .etapa-pedido::after {
            content: "";
            position: absolute;
            top: 18px;
            left: calc(50% + 20px);
            width: calc(100% - 40px);
            height: 3px;
            background: #46515d;
            z-index: 1;
        }

        .etapa-pedido:last-child::after {
            display: none;
        }

        .etapa-pedido.conector-ativo::after {
            background: #087cff;
            box-shadow: 0 0 8px #087cff88;
        }

        .etapa-pedido.conector-ativo::before {
            content: "";
            position: absolute;
            top: 14px;
            right: -1px;
            width: 9px;
            height: 9px;
            border-top: 3px solid #087cff;
            border-right: 3px solid #087cff;
            transform: rotate(45deg);
            z-index: 2;
        }

        /* Etapas concluídas */

        .etapa-pedido.concluida {
            color: #168cff;
            font-weight: bold;
        }

        .etapa-pedido.concluida span {
            background: #087cff;
            border-color: #168cff;
            color: white;
            box-shadow: 0 0 12px #087cff77;
        }

        /* Etapa atual */

        .etapa-pedido.atual {
            color: white;
            font-weight: bold;
        }

        .etapa-pedido.atual span {
            background: #168cff;
            border: 3px solid white;
            color: white;
            box-shadow: 0 0 16px #087cff;
            transform: scale(1.12);
        }

        /* Etapas futuras */

        .etapa-pedido.pendente {
            color: #777;
        }

        .botoes-comprovante {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .botoes-comprovante a,
        .botoes-comprovante button {
            background: #087cff;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .botoes-comprovante a:hover,
        .botoes-comprovante button:hover {
            background: #0060cc;
        }

        .sem-comprovante {
            text-align: center;
            padding: 40px 15px;
        }

        /* =====================================
           RESPONSIVIDADE
        ===================================== */

        @media (max-width: 600px) {

            .pagina-comprovante {
                padding: 12px;
                margin: 20px auto;
            }

            .comprovante-box {
                padding: 18px;
            }

            .rastreamento-pedido {
                padding: 20px 8px;
            }

            .etapas-pedido {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .etapa-pedido {
                display: flex;
                align-items: center;
                text-align: left;
                gap: 15px;
                min-height: 65px;
                padding: 5px 10px;
            }

            .etapa-pedido span {
                margin: 0;
                flex-shrink: 0;
            }

            .etapa-pedido::after {
                top: 47px;
                left: 27px;
                width: 3px;
                height: 25px;
            }

            .etapa-pedido.conector-ativo::before {
                top: 61px;
                left: 23px;
                right: auto;
                transform: rotate(135deg);
            }

            .etapa-pedido:last-child::after {
                display: none;
            }

            .produto-comprovante {
                flex-wrap: wrap;
            }

        }

        /* =====================================
           IMPRESSÃO
        ===================================== */

        @media print {

            header,
            .botoes-comprovante {
                display: none !important;
            }

            body {
                background: white !important;
                color: black !important;
            }

            .comprovante-box {
                background: white !important;
                color: black !important;
                box-shadow: none;
                border: 1px solid #999;
            }

            .comprovante-box h1,
            .comprovante-box h2,
            .total-comprovante {
                color: #087cff !important;
            }

            .rastreamento-pedido {
                background: white !important;
                border: 1px solid #999;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>RS Store</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#produtos">Produtos</a>
        </nav>
    </header>

    <main class="pagina-comprovante">

        <div class="comprovante-box" id="conteudoComprovante">
            <p>Carregando comprovante...</p>
        </div>

    </main>

    <script>

        // ========================================
        // CARREGAR COMPROVANTE
        // ========================================

        function carregarComprovante() {

            const area = document.getElementById(
                "conteudoComprovante"
            );

            const comprovante = JSON.parse(
                localStorage.getItem("comprovanteCompra")
            );

            if (!comprovante) {

                area.innerHTML = `
                    <div class="sem-comprovante">

                        <h2>Nenhum comprovante encontrado</h2>

                        <p>
                            Finalize uma compra para visualizar seu comprovante.
                        </p>

                        <a href="index.html">Voltar para a loja</a>

                    </div>
                `;

                return;
            }


            // ========================================
            // PRODUTOS COMPRADOS
            // ========================================

            let produtosHTML = "";

            comprovante.produtos.forEach(function(produto) {

                const quantidade =
                    Number(produto.quantidade) || 1;

                const subtotalProduto =
                    Number(produto.preco) * quantidade;

                produtosHTML += `

                    <div class="produto-comprovante">

                        <span>

                            ${produto.nome} (x${quantidade})

                            <br>

                            <small>
                                Tamanho: ${produto.tamanho || "Não informado"}
                            </small>

                        </span>

                        <strong>
                            R$ ${subtotalProduto.toFixed(2).replace(".", ",")}
                        </strong>

                    </div>

                `;

            });


            // ========================================
            // DADOS DO CLIENTE
            // ========================================

            const cliente = comprovante.cliente || {};


            // ========================================
            // MONTAR COMPROVANTE
            // ========================================

            area.innerHTML = `

                <h1>Compra finalizada!</h1>

                <p>Obrigado por comprar na RS Store.</p>


                <div class="comprovante-secao">

                    <h2>Dados do pedido</h2>

                    <p>
                        <strong>Número:</strong>
                        ${comprovante.numero}
                    </p>

                    <p>
                        <strong>Data:</strong>
                        ${comprovante.data}
                    </p>

                </div>


                <div class="comprovante-secao">

                    <h2>Produtos comprados</h2>

                    ${produtosHTML}

                </div>


                <div class="comprovante-secao">

                    <h2>Dados do cliente</h2>

                    <p>
                        <strong>Nome:</strong>
                        ${cliente.nome || "Não informado"}
                    </p>

                    <p>
                        <strong>E-mail:</strong>
                        ${cliente.email || "Não informado"}
                    </p>

                    <p>
                        <strong>Endereço:</strong>
                        ${cliente.endereco || ""}, ${cliente.numero || ""}
                    </p>

                    <p>
                        <strong>Cidade:</strong>
                        ${cliente.cidade || ""} - ${cliente.estado || ""}
                    </p>

                </div>


                <div class="comprovante-secao">

                    <h2>Pagamento</h2>

                    <p>
                        <strong>Forma de pagamento:</strong>
                        ${comprovante.pagamento || "Não informado"}
                    </p>

                </div>


                <div class="comprovante-secao">

                    <h2>Resumo financeiro</h2>

                    <p>
                        Subtotal:
                        R$ ${Number(comprovante.subtotal).toFixed(2).replace(".", ",")}
                    </p>

                    <p>
                        Desconto:
                        R$ ${Number(comprovante.desconto).toFixed(2).replace(".", ",")}
                    </p>

                    <p>
                        Frete:
                        R$ ${Number(comprovante.frete).toFixed(2).replace(".", ",")}
                    </p>

                    <p class="total-comprovante">
                        Total:
                        R$ ${Number(comprovante.total).toFixed(2).replace(".", ",")}
                    </p>

                </div>


                <div class="comprovante-secao">

                    <h2>Acompanhamento do pedido</h2>

                    ${gerarAcompanhamento(comprovante.status || "realizado")}

                </div>


                <div class="botoes-comprovante">

                    <button onclick="window.print()">
                        Imprimir comprovante
                    </button>

                    <a href="index.html">
                        Voltar para a loja
                    </a>

                </div>

            `;

        }


        // ========================================
        // ACOMPANHAMENTO DO PEDIDO
        // ========================================

        function gerarAcompanhamento(status) {

            const etapas = [

                {
                    id: "realizado",
                    nome: "Pedido realizado"
                },

                {
                    id: "preparacao",
                    nome: "Em preparação"
                },

                {
                    id: "enviado",
                    nome: "Enviado"
                },

                {
                    id: "entregue",
                    nome: "Entregue"
                }

            ];


            let indiceAtual = etapas.findIndex(
                etapa => etapa.id === status
            );


            if (indiceAtual === -1) {
                indiceAtual = 0;
            }


            let etapasHTML = "";


            etapas.forEach(function(etapa, indice) {

                let classe = "pendente";

                if (indice < indiceAtual) {
                    classe = "concluida";
                }

                if (indice === indiceAtual) {
                    classe = "atual";
                }

                const simbolo = indice <= indiceAtual
                    ? "✓"
                    : indice + 1;

                const conector = indice < indiceAtual
                    ? "conector-ativo"
                    : "";


                etapasHTML += `

                    <div class="etapa-pedido ${classe} ${conector}">

                        <span>${simbolo}</span>

                        <strong>${etapa.nome}</strong>

                    </div>

                `;

            });


            return `

                <div class="rastreamento-pedido">

                    <div class="status-atual">

                        Status atual:

                        <strong>
                            ${etapas[indiceAtual].nome}
                        </strong>

                    </div>


                    <div class="etapas-pedido">

                        ${etapasHTML}

                    </div>

                </div>

            `;

        }


        // ========================================
        // INICIAR PÁGINA
        // ========================================

        document.addEventListener(
            "DOMContentLoaded",
            carregarComprovante
        );

    </script>

</body>

</html>
