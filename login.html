<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RS Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <main class="login-container">

        <div class="login-box">

            <h1>RS Store</h1>

            <h2>Entrar</h2>

            <p>Entre para acessar nossa loja.</p>

            <form id="formLogin">

                <label for="usuario">
                    Nome de usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="mensagemLogin"></p>

            </form>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
