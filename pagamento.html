<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento - RS Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div class="logo">
            <h1>RS Store</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="carrinho.html">🛒 Carrinho</a>
        </nav>

    </header>

    <main>

        <section class="pagamento">

            <h2>Finalizar compra</h2>

            <form id="formPagamento">

                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="endereco">Endereço</label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Digite seu endereço"
                    required
                >

                <label for="formaPagamento">
                    Forma de pagamento
                </label>

                <select id="formaPagamento" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="pix">
                        PIX
                    </option>

                    <option value="cartao">
                        Cartão
                    </option>

                    <option value="boleto">
                        Boleto
                    </option>

                </select>

                <button type="submit">
                    Finalizar compra
                </button>

            </form>

            <div id="mensagemCompra"></div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 RS Store - Todos os direitos reservados.
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
